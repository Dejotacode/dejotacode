<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="810" viewBox="0 0 1440 810" role="img"><title>Exemplo de variável, condição e função em JavaScript</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091522"/><stop offset="1" stop-color="#142c45"/></linearGradient></defs><rect width="1440" height="810" fill="url(#bg)"/><circle cx="1390" cy="470" r="340" fill="none" stroke="#25445c" stroke-width="2"/><circle cx="1390" cy="470" r="265" fill="none" stroke="#25445c" stroke-width="2"/><text x="145" y="85" font-family="DejaVu Sans" font-size="36" fill="#e6edf7">JavaScript</text><rect x="155" y="145" width="870" height="570" rx="24" fill="#122239" stroke="#28425d" stroke-width="2"/><text x="190" y="212" font-family="DejaVu Sans Mono" font-size="27" fill="#66dfe7">function verificarMaioridade(idade) {</text><text x="190" y="261" font-family="DejaVu Sans Mono" font-size="27" fill="#66dfe7">  if (idade &gt;= 18) {</text><text x="190" y="310" font-family="DejaVu Sans Mono" font-size="27" fill="#e6edf7">    return &quot;Maior de idade&quot;;</text><text x="190" y="359" font-family="DejaVu Sans Mono" font-size="27" fill="#e6edf7">  }</text><text x="190" y="408" font-family="DejaVu Sans Mono" font-size="27" fill="#e6edf7">  return &quot;Menor de idade&quot;;</text><text x="190" y="457" font-family="DejaVu Sans Mono" font-size="27" fill="#e6edf7">}</text><text x="190" y="506" font-family="DejaVu Sans Mono" font-size="27" fill="#66dfe7">const resultado = verificarMaioridade(20);</text><text x="190" y="555" font-family="DejaVu Sans Mono" font-size="27" fill="#e6edf7">console.log(resultado);</text><rect x="185" y="630" width="805" height="55" rx="12" fill="#0a1728" stroke="#28425d" stroke-width="2"/><text x="208" y="667" font-family="DejaVu Sans Mono" font-size="27" fill="#a4e8b4">→ Maior de idade</text><text x="175" y="765" font-family="DejaVu Sans" font-size="28" fill="#c1d2e5">Variável  ·  Condição  ·  Função