name: Release prep v1.6.0

on:
  push:
    branches:
      - chore/release-v1.6.0

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/release-v1.6.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Update project version
        run: npm version 1.6.0 --no-git-tag-version

      - name: Write release documentation
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const changelogPath = 'CHANGELOG.md';
          let changelog = fs.readFileSync(changelogPath, 'utf8');

          const entry = `## [1.6.0] - 2026-09-16

          ### Adicionado

          - Área administrativa dedicada no frontend atual, separada do layout público.
          - Tela de autenticação em \`/admin/\`.
          - Dashboard autenticado de métricas em \`/admin/metricas/\`.
          - Cards com totais agregados do funil de crescimento.
          - Indicadores derivados de conversão, páginas mais lidas e campanhas.
          - Suporte aos temas claro e escuro e layout responsivo.

          ### Alterado

          - Painel administrativo passou a consumir a API existente sem reintroduzir a árvore legada \`site/\`.
          - Área administrativa usa \`AdminLayout\` próprio para não contaminar o \`page_view\` público.
          - Páginas administrativas configuradas com \`noindex, nofollow\`.
          - Versão do projeto atualizada para \`1.6.0\`.

          ### Qualidade e segurança

          - PR #29 integrado à \`main\` no commit \`4202408ff0c06a6e4e24649459db9b15c9d44419\`.
          - CI do head final #60 e CI pós-merge #61 concluídos com sucesso.
          - Login, sessão, métricas, logout e bloqueio sem sessão homologados localmente.
          - CORS com credenciais e proteção CSRF validados no ambiente local.
          - Temas claro e escuro homologados.
          - Responsividade validada em mobile 375 px e tablet 768 px.
          - \`astro check\`: 0 erros, 0 warnings e 0 hints.
          - Build estático validado com 40 páginas.
          - Nenhuma migration, alteração de API, D1, DNS ou secrets de produção.

          `;

          const marker = 'Todas as mudanças relevantes do DejotaCode serão registradas neste arquivo.\n\n';
          if (!changelog.includes('## [1.6.0]')) {
            if (!changelog.includes(marker)) throw new Error('Âncora do CHANGELOG não encontrada');
            changelog = changelog.replace(marker, marker + entry.replace(/^          /gm, ''));
            fs.writeFileSync(changelogPath, changelog);
          }

          const notes = `# DejotaCode v1.6.0 — Painel de Métricas

          A v1.6.0 integra ao frontend atual do DejotaCode uma área administrativa autenticada para acompanhamento das métricas agregadas do projeto.

          ## Destaques

          - Nova área administrativa em \`/admin/\`.
          - Dashboard autenticado em \`/admin/metricas/\`.
          - Totais dos eventos agregados de analytics.
          - Indicadores do funil de crescimento e conversão.
          - Ranking de páginas mais lidas.
          - Visão agregada de campanhas.
          - Interface responsiva com temas claro e escuro.
          - Layout administrativo separado do site público.

          ## Segurança e privacidade

          A versão não altera a taxonomia de analytics nem adiciona rastreamento individual.

          A área administrativa usa a sessão autenticada da API existente, proteção CSRF nos endpoints mutáveis, \`noindex, nofollow\` e não dispara o \`page_view\` do site público.

          Nenhuma alteração de DNS, secrets, schema do D1 ou migration foi necessária.

          ## Homologação

          Validado localmente com frontend em \`http://localhost:4321\`, API em \`http://localhost:8787\` e D1 local, incluindo criação do administrador, login, sessão, carregamento das métricas, logout, bloqueio sem sessão, temas claro/escuro, mobile 375 px e tablet 768 px.

          ## Qualidade

          - PR principal: #29.
          - Head homologado: \`a2b15c46453c839b37fc892f3e13bd5b9215a73e\`.
          - Commit na \`main\`: \`4202408ff0c06a6e4e24649459db9b15c9d44419\`.
          - CI #60: aprovado.
          - CI pós-merge #61: aprovado.
          - \`astro check\`: 0 erros, 0 warnings e 0 hints.
          - Build estático: 40 páginas.

          ## Escopo

          O CMS editorial, editor de conteúdo, biblioteca de mídia e gerenciamento de convites permanecem fora do escopo da v1.6.0.

          ## Estado do rollout

          A integração está homologada localmente e integrada à \`main\`. O rollout no domínio oficial permanece como etapa operacional posterior.
          `;

          fs.writeFileSync('RELEASE_NOTES_V1.6.0.md', notes.replace(/^          /gm, ''));
          NODE

      - name: Commit release prep
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md RELEASE_NOTES_V1.6.0.md
          git commit -m "chore(release): prepara v1.6.0"
          git push origin HEAD:chore/release-v1.6.0
