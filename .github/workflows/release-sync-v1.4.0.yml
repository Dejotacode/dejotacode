name: Release sync v1.4.0

on:
  push:
    branches:
      - release/v1.4.0

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v1.4.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Sync package-lock version
        run: npm install --package-lock-only --ignore-scripts

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/release-sync-v1.4.0.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/release-sync-v1.4.0.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore(release): sincroniza lockfile da v1.4.0"
          git push origin HEAD:release/v1.4.0
