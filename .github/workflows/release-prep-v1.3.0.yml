name: Release prep v1.3.0

on:
  pull_request:

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.head_ref == 'chore/release-v1.3.0'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          ref: chore/release-v1.3.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Sync package-lock version
        run: npm install --package-lock-only --ignore-scripts

      - name: Validate versions
        run: |
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.version!=='1.3.0'||l.version!=='1.3.0'||l.packages?.['']?.version!=='1.3.0'){throw new Error('Version mismatch')} console.log('package.json/package-lock.json = 1.3.0')"

      - name: Commit lockfile when needed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(release): sincroniza lockfile da v1.3.0"
          git push origin HEAD:chore/release-v1.3.0
