name: Visual QA v1.4.0

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  visual-qa:
    name: Visual QA
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install temporary Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build:production

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/dejotacode-preview.log 2>&1 &
          echo $! > /tmp/dejotacode-preview.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4321/ >/dev/null; then
              echo "Preview disponível."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/dejotacode-preview.log
          exit 1

      - name: Run visual QA matrix
        env:
          QA_BASE_URL: http://127.0.0.1:4321
        run: node .github/qa/visual-check.mjs

      - name: Show preview log on failure
        if: failure()
        run: cat /tmp/dejotacode-preview.log || true

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-v1.4.0
          path: qa-artifacts/v1.4.0
          if-no-files-found: warn
          retention-days: 7
